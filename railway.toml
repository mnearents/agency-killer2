# Default Railway config — used by the web service.
# The worker service uses /worker.railway.toml (set via Railway dashboard).

[build]
builder = "nixpacks"
# No browser install here. Nothing the web service serves uses Playwright:
# `domain/email/renderer.ts`, the only importer, has no callers at all.
#
# It cost twice over. Web builds gate migrations via preDeployCommand, so every
# schema change waited several minutes on a Chromium download, and the worker
# meanwhile deployed new code against the old schema. And `playwright install
# --with-deps` runs apt-get, which failed this build outright when Ubuntu's
# security mirror was mid-sync:
#   File has unexpected size (1298218 != 1298210). Mirror sync in progress?
buildCommand = "pnpm install --frozen-lockfile && pnpm build"

[deploy]
preDeployCommand = ["pnpm db:migrate"]
startCommand = "pnpm start:web"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
